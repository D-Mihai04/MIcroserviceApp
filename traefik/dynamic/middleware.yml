http:
  middlewares:
    auth-forward:
      forwardAuth:
        address: "http://auth-service:8080/auth/validate"
        trustForwardHeader: true
        authResponseHeaders:
          - "X-User-Id"
          - "X-User-Role"
          - "X-User-Name"

    strip-api-prefix:
      stripPrefix:
        prefixes:
          - "/api"
        forceSlash: false

    cors-headers:
      headers:
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "PATCH"
          - "DELETE"
          - "OPTIONS"
        accessControlAllowHeaders:
          - "*"
        accessControlAllowOriginList:
          - "*"
        accessControlMaxAge: 3600
        addVaryHeader: true
