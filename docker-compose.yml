services:
  postgres:
    image: postgres:16-alpine
    container_name: ds-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "0000"
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    networks:
      - ds-network

  reverse-proxy:
    image: traefik:v3.1
    container_name: ds-traefik
    restart: unless-stopped
    ports:
      - "80:80"       
      - "8080:8080"   
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - ds-network
    depends_on:
      - auth-service
      - user-service
      - device-service
      - frontend

  auth-service:
    build:
      context: ./DS.AuthService
      dockerfile: Dockerfile
    container_name: ds-auth-service
    restart: unless-stopped
    ports:
      - "5100:8080"
    environment:
      ConnectionStrings__AuthDb: "Host=postgres;Port=5432;Database=AuthDb;Username=postgres;Password=0000"
      Services__UserServiceUrl: "http://user-service:8080"
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_ENVIRONMENT: "Development"
    networks:
      - ds-network
    depends_on:
      - postgres

  user-service:
    build:
      context: ./DS.UserService
      dockerfile: Dockerfile
    container_name: ds-user-service
    restart: unless-stopped
    ports:
      - "5068:8080"
    environment:
      ConnectionStrings__UserDb: "Host=postgres;Port=5432;Database=UserDb;Username=postgres;Password=0000"
      Services__DeviceServiceUrl: "http://device-service:8080"
      Services__AuthServiceUrl: "http://auth-service:8080"
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_ENVIRONMENT: "Development"
    networks:
      - ds-network
    depends_on:
      - postgres
      - auth-service

  device-service:
    build:
      context: ./DS.DeviceService
      dockerfile: Dockerfile
    container_name: ds-device-service
    restart: unless-stopped
    ports:
      - "5228:8080"
    environment:
      ConnectionStrings__DeviceDb: "Host=postgres;Port=5432;Database=DeviceDb;Username=postgres;Password=0000"
      Services__UserServiceUrl: "http://user-service:8080"
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_ENVIRONMENT: "Development"
    networks:
      - ds-network
    depends_on:
      - postgres
      - auth-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ds-frontend
    restart: unless-stopped
    networks:
      - ds-network

networks:
  ds-network:
    name: ds-network
    driver: bridge

volumes:
  postgres_data:
